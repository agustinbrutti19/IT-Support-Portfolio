{% extends "base.html" %}

{% block title %}Edit Ticket #{{ ticket.id }} - Borealis Travel IT Support{% endblock %}

{% block header_subtitle %}
Internal Helpdesk Portal
{% endblock %}

{% block content %}

            <h2>Edit Ticket #{{ ticket.id }}</h2>

            <form method="post" action="/tickets/{{ ticket.id }}/edit">

                <label for="title">Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ ticket.title }}"
                    required
                >

                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    rows="8"
                    required
                >{{ ticket.description }}</textarea>

                <button type="submit">Save Changes</button>

            </form>

{% endblock %}
