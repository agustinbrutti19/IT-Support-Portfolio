{% extends "base.html" %}

{% block title %}New Ticket - Borealis Travel IT Support{% endblock %}

{% block header_subtitle %}
Internal Helpdesk Portal
{% endblock %}

{% block content %}

            <h2>New Ticket</h2>

            <p>Create a new helpdesk ticket.</p>
            <form method="post" action="/new-ticket">

                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>

                <label for="description">Description</label>
                <textarea id="description" name="description" required></textarea>

                <label for="user_id">User</label>
                
                <select id="user_id" name="user_id" required>

                    <option value="">Select a user</option>
                    {% for user in users %}

                        <option value="{{ user.id }}">
                            {{ user.name }}
                        </option>

                    {% endfor %}

                </select>

                <label for="category_id">Category</label>
                <select id="category_id" name="category_id" required>
                    
                    <option value="">Select a category</option>

                    {% for category in categories %}

                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>
                    
                    {% endfor %}    

                </select>

                <label for="impact_id">Impact</label>

                <select id="impact_id" name="impact_id" required>

                    <option value="">Select an impact</option>

                    {% for impact in impacts %}

                        <option value="{{ impact.id }}">
                            {{ impact.name }}
                        </option>

                    {% endfor %}

                </select>
                
                <label for="urgency_id">Urgency</label>

                <select id="urgency_id" name="urgency_id" required>

                    <option value="">Select an urgency</option>

                    {% for urgency in urgencies %}

                        <option value="{{ urgency.id }}">
                            {{ urgency.name }}
                        </option>

                    {% endfor %}

                </select>

                <button type="submit">Create Ticket</button>

            </form>

{% endblock %}
